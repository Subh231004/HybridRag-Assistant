services:

  backend:

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    container_name: vectorless-backend

  frontend:

    build:
      context: .
      dockerfile: Dockerfile.frontend

    ports:
      - "8501:8501"

    depends_on:
      - backend

    volumes:
      - .:/app

    container_name: vectorless-frontend